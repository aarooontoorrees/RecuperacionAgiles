name: Testing

on:
  - pull_request

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build project agiles
        run: mvn -B compile

      - name: Run tests
        run: mvn -B test

      - name: Run verification (CheckStyle si está configurado)
        run: mvn -B verify